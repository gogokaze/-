<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YFL Mission Planner</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      width: min(700px, 92vw);
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.8rem;
      color: #f8fafc;
    }

    .flow {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
      font-size: 1.1rem;
    }

    .flow li::before {
      content: "\2192 ";
      color: #38bdf8;
      font-weight: bold;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>YFL Mission Planner — Mission Planning</h1>
    <ul class="flow">
      <li>Path Definition</li>
      <li>Autonomy Stack</li>
      <li>Vehicle Control</li>
      <li>Execution</li>
      <li>Telemetry Feedback</li>
    </ul>
  </main>
</body>
</html>
